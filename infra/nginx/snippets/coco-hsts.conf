# HSTS, set by nginx only (covers redirects and nginx's own error pages; 17 §3, §10.4).
# Any `add_header` in a location drops the server-level ones, so locations that add a header
# include this file again. No preload: hard to undo, owner decision after 3 months.
# Ramp (README › HSTS): launch week 300 → +1 week "86400; includeSubDomains"
#                       → +1 month "31536000; includeSubDomains".
add_header Strict-Transport-Security "max-age=300" always;
