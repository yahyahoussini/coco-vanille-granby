# Server-level settings of every Coco Vanille server block (include right after server_name). Kept out of the
# http level so other sites on the same server keep their own choices (conf.d/coco.conf).
server_tokens off;
limit_req_status 429;

# Compression happens here only: proxied requests drop Accept-Encoding (snippets/coco-proxy.conf),
# so Node never compresses and nothing is compressed twice.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
           application/ld+json application/manifest+json application/xml application/rss+xml
           application/atom+xml image/svg+xml;
