# Temporary public address (install-nginx.sh --temporary, e.g. cocovanille.<ip>.sslip.io): nothing on it may be
# indexed, so the real domain launches without a copy in the search engines. Included next to every coco-hsts.conf
# include of the public site (a location that adds a header drops the server ones). The app's own X-Robots-Tag
# is hidden so each response carries one copy.
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
proxy_hide_header X-Robots-Tag;
