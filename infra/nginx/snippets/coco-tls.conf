# TLS for every HTTPS server. One certificate covers all five names (apex, www, admin, staging,
# admin-staging); install-nginx.sh links it here from /etc/letsencrypt (self-signed until issued).
ssl_certificate /etc/nginx/coco/tls/fullchain.pem;
ssl_certificate_key /etc/nginx/coco/tls/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:coco_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
