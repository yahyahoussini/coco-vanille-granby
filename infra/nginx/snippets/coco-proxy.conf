# Proxy settings for every Node upstream (include inside a location).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $coco_connection;
# nginx compresses (conf.d/coco.conf); ask Node for plain bodies.
proxy_set_header Accept-Encoding "";
# Read and send timeouts stay at the nginx default (60 s); the SSE location raises them.
proxy_connect_timeout 5s;
proxy_next_upstream off;
