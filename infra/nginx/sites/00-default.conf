# Unknown Host or the raw IP: close the connection (444), so no IP-address copy of the site
# gets crawled (17 §3). On 443 the TLS handshake is refused: no certificate is needed here.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  access_log /var/log/nginx/default.access.log combined_timing;
  return 444;
}

server {
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name _;
  ssl_reject_handshake on;
  access_log /var/log/nginx/default.access.log combined_timing;
  return 444;
}
