# Staging · https://staging.cocovanillegranby.com + https://admin-staging.cocovanillegranby.com (17 §5).
# Password first (the real lock), noindex second (the backup if auth is ever misconfigured).
# Credentials: /etc/nginx/coco/staging.htpasswd (install-nginx.sh asks for them once).
include /etc/nginx/coco/upstreams/staging.conf;

server {
  listen 80;
  listen [::]:80;
  server_name staging.cocovanillegranby.com admin-staging.cocovanillegranby.com;
  access_log /var/log/nginx/staging.access.log combined_timing;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name staging.cocovanillegranby.com;
  include /etc/nginx/snippets/coco-tls.conf;
  include /etc/nginx/snippets/coco-hsts.conf;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  proxy_hide_header X-Robots-Tag;

  auth_basic "Coco Vanille staging";
  auth_basic_user_file /etc/nginx/coco/staging.htpasswd;

  access_log /var/log/nginx/staging.access.log combined_timing;
  error_log /var/log/nginx/staging.error.log warn;
  client_max_body_size 12m;

  location ~ ^/(admin|api|studio)(/|$) {
    return 404;
  }
  location ~ /\.(?!well-known/) {
    return 404;
  }
  location ^~ /media/demandes/ {
    return 404;
  }
  location = /svc/demande/ {
    client_max_body_size 32m;
    limit_req zone=coco_forms burst=10 nodelay;
    proxy_pass http://coco_staging_web;
    include /etc/nginx/snippets/coco-proxy.conf;
  }
  # Checkout: one form post per order, plus a few retries when a window was just taken.
  location = /svc/commande/ {
    limit_req zone=coco_forms burst=10 nodelay;
    proxy_pass http://coco_staging_web;
    include /etc/nginx/snippets/coco-proxy.conf;
  }
  # Studio and the worker refresh the pages here (17 §12.3): local callers only, no password, the app's secret.
  location ^~ /svc/revalidate {
    auth_basic off;
    allow 127.0.0.1;
    allow ::1;
    allow 172.16.0.0/12;
    deny all;
    proxy_pass http://coco_staging_web;
    include /etc/nginx/snippets/coco-proxy.conf;
  }
  location ^~ /media/ {
    alias /opt/coco/staging/media/;
    try_files $uri =404;
  }
  location / {
    proxy_pass http://coco_staging_web;
    include /etc/nginx/snippets/coco-proxy.conf;
  }

  error_page 502 503 504 /50x.html;
  location = /50x.html {
    root /var/www/coco;
    internal;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin-staging.cocovanillegranby.com;
  include /etc/nginx/snippets/coco-tls.conf;
  include /etc/nginx/snippets/coco-hsts.conf;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  proxy_hide_header X-Robots-Tag;

  auth_basic "Coco Vanille staging";
  auth_basic_user_file /etc/nginx/coco/staging.htpasswd;

  access_log /var/log/nginx/staging.access.log combined_timing;
  error_log /var/log/nginx/staging.error.log warn;
  client_max_body_size 12m;

  location ~ /\.(?!well-known/) {
    return 404;
  }
  location ~ ^/(api/users/(login|forgot-password|reset-password)|svc/(connexion|nip|verifier|cle/[a-z-]+))/?$ {
    limit_req zone=coco_login burst=5 nodelay;
    proxy_pass http://coco_staging_studio;
    include /etc/nginx/snippets/coco-proxy.conf;
  }
  location ^~ /svc/evenements/ {
    proxy_pass http://coco_staging_studio;
    include /etc/nginx/snippets/coco-proxy.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
  location / {
    proxy_pass http://coco_staging_studio;
    include /etc/nginx/snippets/coco-proxy.conf;
  }

  error_page 502 503 504 /50x.html;
  location = /50x.html {
    root /var/www/coco;
    internal;
  }
}
