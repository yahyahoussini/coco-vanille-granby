# Coco Studio · https://admin.cocovanillegranby.com (16b §2, §3; 17 §3). Never indexed.
# The upstream include is loaded once by cocovanillegranby.com.conf (same environment).

server {
  listen 80;
  listen [::]:80;
  server_name admin.cocovanillegranby.com;
  access_log /var/log/nginx/admin.access.log combined_timing;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://admin.cocovanillegranby.com$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin.cocovanillegranby.com;
  include /etc/nginx/snippets/coco-tls.conf;

  # Server-level headers on every status, nginx error pages included (`always`). No location below
  # adds a header of its own, so they all inherit these. The app sends the same X-Robots-Tag:
  # hide it so the response carries one copy.
  include /etc/nginx/snippets/coco-hsts.conf;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  proxy_hide_header X-Robots-Tag;

  access_log /var/log/nginx/admin.access.log combined_timing;
  error_log /var/log/nginx/admin.error.log warn;

  # Phone photos from the shop (Payload resizes them).
  client_max_body_size 12m;

  location ~ /\.(?!well-known/) {
    return 404;
  }

  # Brute force (16b §4 #7): small burst per IP, then 429. Payload also locks the account.
  location ~ ^/api/users/(login|forgot-password|reset-password)/?$ {
    limit_req zone=coco_login burst=5 nodelay;
    proxy_pass http://coco_production_studio;
    include /etc/nginx/snippets/coco-proxy.conf;
  }

  # Server-sent events for new orders (16b §6.4): no buffering, long-lived.
  location ^~ /flux/ {
    proxy_pass http://coco_production_studio;
    include /etc/nginx/snippets/coco-proxy.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location / {
    proxy_pass http://coco_production_studio;
    include /etc/nginx/snippets/coco-proxy.conf;
  }

  error_page 502 503 504 /50x.html;
  location = /50x.html {
    root /var/www/coco;
    internal;
  }
}
