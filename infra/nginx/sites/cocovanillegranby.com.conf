# Public site · https://cocovanillegranby.com (apex canonical, 17 §3, §10.2).
# Upstreams coco_production_web / coco_production_studio: written by deploy.sh (blue/green).
include /etc/nginx/coco/upstreams/production.conf;

# HTTP → HTTPS on the apex, one hop. ACME challenges stay on plain HTTP.
server {
  listen 80;
  listen [::]:80;
  server_name cocovanillegranby.com www.cocovanillegranby.com;
  access_log /var/log/nginx/public.access.log combined_timing;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://cocovanillegranby.com$request_uri;
  }
}

# www → apex, one hop.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.cocovanillegranby.com;
  include /etc/nginx/snippets/coco-tls.conf;
  include /etc/nginx/snippets/coco-hsts.conf;
  access_log /var/log/nginx/public.access.log combined_timing;
  return 301 https://cocovanillegranby.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name cocovanillegranby.com;
  include /etc/nginx/snippets/coco-tls.conf;
  include /etc/nginx/snippets/coco-hsts.conf;

  # Public log only feeds log-bots.mjs; admin logs (staff IPs) live elsewhere (17 §8.3).
  access_log /var/log/nginx/public.access.log combined_timing;
  error_log /var/log/nginx/public.error.log warn;

  # Order forms may carry a reference photo for a cake request.
  client_max_body_size 12m;

  # Defence in depth: src/proxy.js already answers 404 here (16b §2).
  location ~ ^/(admin|api|studio)(/|$) {
    return 404;
  }
  location ~ /\.(?!well-known/) {
    return 404;
  }

  # Hashed build assets: cache for a year.
  location ^~ /_next/static/ {
    proxy_pass http://coco_production_web;
    include /etc/nginx/snippets/coco-proxy.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/coco-hsts.conf;
  }

  # Payload uploads, straight from disk (MEDIA_DIR). Filenames are not content-hashed: a replaced
  # photo gets a new name or ?v= (17 §2.1). The CSP stops an uploaded SVG from running script.
  location ^~ /media/ {
    alias /opt/coco/production/media/;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    include /etc/nginx/snippets/coco-hsts.conf;
  }

  # Cache refresh from Studio and the worker (17 §12.3): local callers only, plus the app's secret.
  # Containers reach the public host from the Docker range; add the VPS IP if hairpin NAT applies.
  location ^~ /svc/revalidate {
    allow 127.0.0.1;
    allow ::1;
    allow 172.16.0.0/12;
    deny all;
    proxy_pass http://coco_production_web;
    include /etc/nginx/snippets/coco-proxy.conf;
  }

  # Uptime monitor (outside the VPS) checks /svc/health/; keep it cheap to call.
  location ^~ /svc/health {
    limit_req zone=coco_health burst=10 nodelay;
    proxy_pass http://coco_production_web;
    include /etc/nginx/snippets/coco-proxy.conf;
  }

  location / {
    proxy_pass http://coco_production_web;
    include /etc/nginx/snippets/coco-proxy.conf;
  }

  # Upstream down (deploy gone wrong, OOM): a small page with the phone number, real 5xx status.
  error_page 502 503 504 /50x.html;
  location = /50x.html {
    root /var/www/coco;
    internal;
  }
}
