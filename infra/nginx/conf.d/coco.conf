# Coco Vanille · http-level settings shared by every site (installed as /etc/nginx/conf.d/coco.conf).

server_tokens off;

# combined + timings: rank-first's log-bots.mjs parses `combined` and ignores trailing fields,
# so bot reports keep working and we get server timing (a TTFB proxy) for free (17 §3).
log_format combined_timing '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                           '$request_time $upstream_response_time';

# Rate limits (per client IP). Login: brute force (16b §4 #7). Health: public but cheap to abuse.
limit_req_zone $binary_remote_addr zone=coco_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=coco_health:1m rate=30r/m;
limit_req_status 429;

# Compression happens here only: proxied requests drop Accept-Encoding (snippets/coco-proxy.conf),
# so Node never compresses and nothing is compressed twice.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
           application/ld+json application/manifest+json application/xml application/rss+xml
           application/atom+xml image/svg+xml;

# Keep-alive to the Node upstreams (see snippets/coco-proxy.conf).
map $http_upgrade $coco_connection {
  default upgrade;
  ''      '';
}
