# Coco Vanille · http-level items (installed as /etc/nginx/conf.d/coco.conf).
# Only names of our own live here (coco_*), so the file sits beside other sites on a shared server without
# a duplicate directive: Ubuntu's nginx.conf already says `gzip on;`, and another app may set server_tokens.
# Everything that changes behaviour (compression, server_tokens, limit_req_status) is in
# snippets/coco-server.conf, included by each Coco server block only.

# combined + timings: rank-first's log-bots.mjs parses `combined` and ignores trailing fields,
# so bot reports keep working and we get server timing (a TTFB proxy) for free (17 §3).
log_format coco_timing '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       '$request_time $upstream_response_time';

# Rate limits (per client IP). Login: brute force (16b §4 #7). Forms: each cake request or checkout queues
# a text or an email to the number typed in. Health: public but cheap to abuse.
limit_req_zone $binary_remote_addr zone=coco_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=coco_forms:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=coco_health:1m rate=30r/m;

# Keep-alive to the Node upstreams (see snippets/coco-proxy.conf).
map $http_upgrade $coco_connection {
  default upgrade;
  ''      '';
}
