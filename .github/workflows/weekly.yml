# Weekly rank-first measurement · Monday 06:00 America/Toronto (plan v1 §12 table; 17 §2.2).
# GitHub cron is UTC only: two schedules (10:00 UTC in EDT, 11:00 UTC in EST) and a clock check
# keep the run at 06:00 Toronto time all year. Each step without its key is skipped, and
# tools/weekly.mjs names in the report what was not measured.
# Inputs: the repository's scoreboard/ is the single source of truth (scoreboard/README.md): prompts.csv,
# competitors.csv, reviews.csv and the hand-filled runs/<week>.csv (never runs/proxy/, the proxy weeks).
# site.config.json comes from apps/web/scripts/rank-config.mjs with its Québec market block (google.ca on
# Granby, AI web search from Canada on America/Toronto time); the steps also pass those options.
# The weekly set is every prompt but the candidates; the freeze Monday (candidates X1–X13) is a manual
# run with the "ids" input.
# History: the automatic rows (serp, ai, runs/<week>-google|-ai|-gsc.csv, reports, market maps) are carried
# from the newest successful run that uploaded them (artifact kept 90 days; the other cron's run uploads
# nothing), so trends and streaks build week after week.
# Secrets (all optional): SERPAPI_KEY · OPENAI_API_KEY · PERPLEXITY_API_KEY · GEMINI_API_KEY ·
#   ANTHROPIC_API_KEY · GOOGLE_SERVICE_ACCOUNT_JSON (Search Console + GA4) · GA4_PROPERTY_ID · PSI_KEY
# Variable: SITE_LIVE=true once cocovanillegranby.com serves the site (turns on the live checks).
name: Weekly rank-first

on:
  schedule:
    - cron: '0 10 * * 1'
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      ids:
        description: 'Prompt ids to measure instead of the weekly set (comma-separated), e.g. the freeze Monday: the 33 prompts, X1–X13 and the variants'
        required: false
        default: ''

concurrency:
  group: weekly-rank-first
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  weekly:
    name: Monday measurement
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      PSI_KEY: ${{ secrets.PSI_KEY }}
      SITE_LIVE: ${{ vars.SITE_LIVE }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: rank
    steps:
      - name: Only at 06:00 in Toronto
        id: clock
        working-directory: .
        run: |
          hour="$(TZ=America/Toronto date +%H)"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$hour" != 06 ]; then
            echo "It is ${hour}:00 in Toronto: the other schedule covers this week."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.clock.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.clock.outputs.run == 'true'
        with:
          node-version: 22

      - name: Prepare the rank-first folder
        if: steps.clock.outputs.run == 'true'
        working-directory: .
        run: |
          mkdir -p rank/scoreboard/runs rank/reports
          node apps/web/scripts/rank-config.mjs --out rank/site.config.json
          echo "WEEK=$(TZ=America/Toronto date +%G-W%V)" >> "$GITHUB_ENV"

      - name: Restore last week's scoreboard
        if: steps.clock.outputs.run == 'true'
        run: |
          # The newest successful run that kept a history: the other cron's run also ends "success" but uploads
          # nothing (the clock check skips its steps), so the latest successful run alone is usually empty.
          # (a failed listing stops the step, as before: a run without its history must not upload one)
          ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow weekly.yml --status success --limit 20 --json databaseId --jq '.[].databaseId')"
          restored=""
          for id in $ids; do
            if out="$(gh run download "$id" --repo "$GITHUB_REPOSITORY" --name rank-first-history --dir . 2>&1)"; then restored="$id"; break; fi
            echo "run $id: no history (${out})"
          done
          if [ -n "$restored" ]; then echo "restored from run $restored"; else echo "no previous history: first week"; fi
          # The repository's scoreboard/ wins over the history: prompts, competitors, reviews and the hand-filled
          # runs/<week>.csv are copied fresh (a restored hand-filled copy is dropped first, so a file moved or fixed
          # in the repository never comes back). Only top-level runs/*.csv: runs/proxy/ never enters a trend.
          # No fallback to data/: without the repository's scoreboard/ the week is not measured.
          for f in prompts.csv competitors.csv; do
            if [ ! -f "../scoreboard/$f" ]; then echo "::error::scoreboard/$f is missing: commit scoreboard/, the source of truth (scoreboard/README.md)"; exit 1; fi
          done
          mkdir -p scoreboard/runs
          cp ../scoreboard/prompts.csv ../scoreboard/competitors.csv scoreboard/
          if [ -f ../scoreboard/reviews.csv ]; then cp ../scoreboard/reviews.csv scoreboard/; fi
          rm -rf scoreboard/runs/proxy
          find scoreboard/runs -maxdepth 1 -type f -name '*.csv' ! -name '*-google.csv' ! -name '*-ai.csv' ! -name '*-gsc.csv' -delete
          if [ -d ../scoreboard/runs ]; then find ../scoreboard/runs -maxdepth 1 -type f -name '*.csv' -exec cp {} scoreboard/runs/ \; ; fi
          # competitor profiles (tools/crawl.mjs) for the market map
          if [ -d ../crawl ]; then rm -rf crawl && cp -r ../crawl crawl; fi
          echo "runs for this week's score:"; ls scoreboard/runs

      - name: Google credentials (Search Console, GA4)
        if: steps.clock.outputs.run == 'true' && env.GOOGLE_SERVICE_ACCOUNT_JSON != ''
        run: |
          umask 077
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json

      - name: SERP (SerpApi, google.ca, Granby)
        if: steps.clock.outputs.run == 'true' && env.SERPAPI_KEY != ''
        continue-on-error: true
        env:
          PROMPT_IDS: ${{ inputs.ids }}
        run: |
          # the weekly set (every prompt but the candidates), or the ids of a manual run; hl = each prompt's lang
          if [ -n "$PROMPT_IDS" ]; then sel=(--ids "${PROMPT_IDS// /}"); else sel=(--skip-type candidate); fi
          node ../tools/serp.mjs --week "$WEEK" "${sel[@]}" --gl ca --domain google.ca --location "Granby,Quebec,Canada"

      - name: AI engines (ChatGPT, Perplexity, Gemini, Claude)
        if: steps.clock.outputs.run == 'true' && (env.OPENAI_API_KEY != '' || env.PERPLEXITY_API_KEY != '' || env.GEMINI_API_KEY != '' || env.ANTHROPIC_API_KEY != '')
        continue-on-error: true
        env:
          PROMPT_IDS: ${{ inputs.ids }}
        run: |
          if [ -n "$PROMPT_IDS" ]; then sel=(--ids "${PROMPT_IDS// /}"); else sel=(--skip-type candidate); fi
          node ../tools/ai-runs.mjs --week "$WEEK" "${sel[@]}" --country CA --region Quebec --city Granby --timezone America/Toronto

      - name: Core Web Vitals (PageSpeed Insights)
        if: steps.clock.outputs.run == 'true' && env.SITE_LIVE == 'true'
        continue-on-error: true
        run: |
          node ../tools/cwv.mjs --sitemap https://cocovanillegranby.com/sitemap.xml --max 6 \
            ${PSI_KEY:+--key "$PSI_KEY"} --json "reports/cwv-${WEEK}.json"

      - name: Weekly report (score, market, Search Console, GA4, live checks, dashboard)
        if: steps.clock.outputs.run == 'true'
        run: |
          live=""
          if [ "$SITE_LIVE" = true ]; then live="--live"; fi
          node ../tools/weekly.mjs --week "$WEEK" --no-serp --no-ai $live

      - name: Report in the job summary
        if: steps.clock.outputs.run == 'true'
        run: |
          if [ -f "reports/${WEEK}.md" ]; then cat "reports/${WEEK}.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Remove credentials
        if: always()
        working-directory: .
        run: rm -f rank/google-service-account.json

      - name: Keep the history for next week
        if: steps.clock.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rank-first-history
          path: |
            rank/scoreboard
            rank/serp
            rank/ai
            rank/reports
          retention-days: 90
          if-no-files-found: ignore
